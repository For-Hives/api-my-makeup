name: Just Build Docker

# The just-build job is the API check required on main: no
# continue-on-error, no step skipped on a cache hit, no paths filter.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fictional values, for the admin build and the tests only
env:
  JWT_SECRET: "XXXXXXXXXXXXXXXXXXTEST=="
  APP_KEYS: "XXXXXXXXXXXXXXXXXXTEST==,XXXXXXXXXXXXXXXXXXTEST==,XXXXXXXXXXXXXXXXXXTEST==,XXXXXXXXXXXXXXXXXXTEST=="
  API_TOKEN_SALT: "XXXXXXXXXXXXXXTEST=="
  ADMIN_JWT_SECRET: "XXXXXXXXXXXTEST=="

jobs:
  just-build:
    runs-on: ubuntu-latest
    # Same major version as production; one throwaway database per test file
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Strapi 4 packages require Node <= 20; the runner default is newer
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install the locked dependencies
        run: yarn install --frozen-lockfile
      - name: Build the admin panel
        run: yarn build
      - name: Tests on Postgres
        env:
          TEST_DB_CLIENT: postgres
          TEST_DATABASE_HOST: 127.0.0.1
          TEST_DATABASE_PORT: 5432
          TEST_DATABASE_USERNAME: postgres
          TEST_DATABASE_PASSWORD: postgres
        run: yarn test
      - name: Try Building image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: api-my-makeup:ci
